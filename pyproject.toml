[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nora-quantica"
version = "0.1.0"
description = "MVP experimental de un bot conversacional con predisposicion inicializada por entropia cuantica."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]
api = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]
cloud = [
  "google-cloud-firestore>=2.19,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nora_quantica"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
